[project]
name = "ifk-lantmateriet"
version = "0.1.0"
description = "Parse data from Lantmäteriet."
license = { text = "MIT" }
readme = "README.md"
authors = [
    { name = "Mladen Gibanica", email = "11275336+mgcth@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "geopandas ~= 1.2",
    "pyogrio ~= 0.7",
    "pyarrow ~= 16.0",
    "scipy ~= 1.14",
    "unidecode ~= 1.3",
    "tqdm ~= 4.66",
    "typer ~= 0.12",
    "pystac-client == 0.8.6",
    "python-dotenv == 1.0.1",
    "owslib>=0.34.1",
    "pydantic>=2.11.7",
]

[dependency-groups]
lint = [
    "ruff >= 0.17",
]
type = ["mypy >= 2.4", "types-requests ~= 2.28", "pandas-stubs ~= 1.5"]
test = ["pytest >= 9.1", "coverage >= 7.16", "pytest-cov ~= 7.1"]
doc = [
    "mkdocs == 1.6.1",
    "mkdocs-material == 9.7.7",
    "mkdocstrings[python] == 1.0.7",
]
dev = [
    {include-group = "lint"},
    {include-group = "type"},
    {include-group = "test"},
    {include-group = "doc"},
    "pre-commit >= 4.6",
    "ipykernel >= 7.4",
    "matplotlib >= 3.8",
]

[project.scripts]
ifk-lantmateriet = "lantmateriet.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["material"]

[tool.ruff]
line-length = 100
extend-include = ["*.ipynb"]
extend-exclude = ["src/lantmateriet/admin_border_types.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "W", "F", "B", "D", "I", "S"]
ignore = ["D203", "D213", "S101"]
unfixable = ["B", "S"]
pydocstyle.convention = "google"

[tool.mypy]
ignore_missing_imports = true

[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"
